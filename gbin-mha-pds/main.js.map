<div class="app-version">
  <div class="version-info">
    <span class="version-text">{{ buildVersion }}</span>
    @if (isOfflineMode()) {
      <span class="mode-badge offline" title="Application is running in offline mode using mock data">
        [OFFLINE]
      </span>
    } @else {
      <span class="mode-badge online" title="Application is connected to live CCL services">
        [ONLINE]
      </span>
    }
  </div>
</div>
