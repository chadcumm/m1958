<div class="patients-container">
  <!-- Master: Patient List -->
  <div class="patients-master">
    <div class="master-header">
      <h2>Patients</h2>
    </div>
    <app-patient-list (patientSelected)="onPatientSelected($event)" />
  </div>

  <!-- Detail: Patient Detail -->
  <div class="patients-detail">
    <app-patient-detail (viewLogs)="onViewLogs($event)" />
  </div>
</div>
