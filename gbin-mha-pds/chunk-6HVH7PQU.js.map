<div class="filters-container">
  <!-- Search Row -->
  <div class="filter-row search-row">
    <div class="search-input">
      <input
        type="text"
        placeholder="Search name, MRN, or HCN..."
        [value]="searchText()"
        (input)="onSearchChange($any($event.target).value)"
        [disabled]="loading()"
      />
    </div>
    <button
      class="btn-reset"
      (click)="resetFilters()"
      [disabled]="loading() || !hasActiveFilters()"
      title="Clear all filters">
      Clear
    </button>
  </div>

  <!-- Filter Row -->
  <div class="filter-row">
    <div class="filter-group">
      <label>Status</label>
      <select
        [value]="submissionStatus()"
        (change)="onStatusChange($any($event.target).value)"
        [disabled]="loading()">
        @for (opt of statusOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label>From</label>
      <input
        type="date"
        [value]="startDate()"
        (change)="startDate.set($any($event.target).value); onDateChange()"
        [disabled]="loading()"
      />
    </div>

    <div class="filter-group">
      <label>To</label>
      <input
        type="date"
        [value]="endDate()"
        (change)="endDate.set($any($event.target).value); onDateChange()"
        [disabled]="loading()"
      />
    </div>

    <div class="filter-group">
      <label>Functional Centre</label>
      <input
        type="text"
        placeholder="e.g., ACTT"
        [value]="functionalCentre()"
        (input)="onFunctionalCentreChange($any($event.target).value)"
        [disabled]="loading()"
      />
    </div>

    <div class="filter-group">
      <label>Program</label>
      <input
        type="text"
        placeholder="Program name"
        [value]="programName()"
        (input)="onProgramChange($any($event.target).value)"
        [disabled]="loading()"
      />
    </div>
  </div>
</div>
