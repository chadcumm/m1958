<div class="logs-container">
  <div class="logs-header">
    <h2>MHA PDS Logs</h2>
    <p>View and search operational logs</p>
  </div>

  <div class="logs-content">
    <app-log-filters />

    <app-log-table (logSelected)="onLogSelected($event)" />

    @if (showDetail()) {
      <app-log-detail
        (closed)="onCloseDetail()"
        (viewPayload)="onViewPayload($event)"
      />
    }

    @if (showPayload()) {
      <app-payload-viewer (closed)="onClosePayload()" />
    }
  </div>
</div>
