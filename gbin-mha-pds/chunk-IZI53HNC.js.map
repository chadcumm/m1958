<div class="log-filters">
  <div class="filter-row">
    <div class="filter-group">
      <label for="logType">Log Type</label>
      <select id="logType" [(ngModel)]="selectedLogType" name="logType">
        @for (option of logTypeOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label for="status">Status</label>
      <select id="status" [(ngModel)]="selectedStatus" name="status">
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label for="daysBack">Days Back</label>
      <input
        type="number"
        id="daysBack"
        [(ngModel)]="daysBack"
        name="daysBack"
        min="1"
        max="365"
      />
    </div>
  </div>

  <div class="filter-row">
    <div class="filter-group">
      <label for="startDate">Start Date</label>
      <input
        type="date"
        id="startDate"
        [(ngModel)]="startDate"
        name="startDate"
      />
    </div>

    <div class="filter-group">
      <label for="endDate">End Date</label>
      <input
        type="date"
        id="endDate"
        [(ngModel)]="endDate"
        name="endDate"
      />
    </div>

    <div class="filter-group">
      <label for="relatedScript">Related Script</label>
      <input
        type="text"
        id="relatedScript"
        [(ngModel)]="relatedScript"
        name="relatedScript"
        placeholder="Script name contains..."
      />
    </div>
  </div>

  <div class="filter-actions">
    <button type="button" class="btn-primary" (click)="onApplyFilters()">
      Apply Filters
    </button>
    <button type="button" class="btn-secondary" (click)="onResetFilters()">
      Reset
    </button>
  </div>
</div>
